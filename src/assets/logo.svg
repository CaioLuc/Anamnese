             C 88 94, 90 114, 100 108
             C 110 102, 114 90, 124 94
             C 134 98, 138 106, 148 104" fill="none" stroke="#67E8F9" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"></path>
