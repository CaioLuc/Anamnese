<svg id="logo-svg" width="400" height="400" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="sphereGrad" cx="38%" cy="32%" r="65%"><stop offset="0%" stop-color="#67E8F9"></stop><stop offset="45%" stop-color="#38BDF8"></stop><stop offset="100%" stop-color="#312E81"></stop></radialGradient>
        <radialGradient id="glossGrad" cx="35%" cy="28%" r="45%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"></stop>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
        </radialGradient>
        <radialGradient id="innerShadow" cx="60%" cy="70%" r="55%">
          <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.35"></stop>
          <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"></stop>
        </radialGradient>
        <radialGradient id="rimLight" cx="50%" cy="95%" r="50%">
          <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.3"></stop>
          <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"></stop>
        </radialGradient>
        <filter id="softBlur">
