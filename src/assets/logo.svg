        </filter>
        <clipPath id="sphereClip">
          <circle cx="100" cy="100" r="78"></circle>
        </clipPath>
      </defs>

      <circle cx="100" cy="106" r="76" fill="#0E1844" fill-opacity="0.18" filter="url(#softBlur)"></circle>

      <circle cx="100" cy="100" r="78" fill="url(#sphereGrad)"></circle>

      <circle cx="100" cy="100" r="78" fill="url(#innerShadow)" clip-path="url(#sphereClip)"></circle>
      <circle cx="100" cy="100" r="78" fill="url(#rimLight)" clip-path="url(#sphereClip)"></circle>

      <ellipse cx="100" cy="100" rx="78" ry="78" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.25"></ellipse>

      <circle cx="100" cy="100" r="78" fill="url(#glossGrad)" clip-path="url(#sphereClip)"></circle>

      <g clip-path="url(#sphereClip)">
